<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 확인 · 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <header id="nav"></header>
  <main>
    <div class="result card" id="result">
      <div class="result-icon">⏳</div>
      <h1>결제를 확인하고 있어요</h1>
      <p class="subtitle">잠시만 기다려 주세요…</p>
    </div>
  </main>

  <script>
    const box = document.getElementById("result");

    function showFail(text) {
      box.innerHTML = `
        <div class="result-icon">⚠️</div>
        <h1>결제를 완료하지 못했어요</h1>
        <p class="subtitle">${escapeHtml(text)}</p>
        <a class="btn" href="index.html">상품 목록으로</a>`;
    }

    async function confirmPayment() {
      const user = await requireLogin();
      if (!user) return;

      // 토스가 주소 뒤에 붙여 보내준 값
      const params = new URLSearchParams(location.search);
      const body = {
        paymentKey: params.get("paymentKey"),
        orderId: params.get("orderId"),
        amount: Number(params.get("amount")),
      };
      if (!body.paymentKey || !body.orderId) return showFail("결제 정보가 없어요.");

      // 서버 함수가 금액을 검증하고 토스에 최종 승인을 요청한다
      const { data, error } = await sb.functions.invoke("confirm-payment", { body });
      if (error) {
        let text = error.message;
        try { text = (await error.context.json()).message || text; } catch (_) {}
        return showFail(text);
      }

      const o = data.order;
      box.innerHTML = `
        <div class="result-icon">🎉</div>
        <h1>결제가 완료되었어요</h1>
        <dl>
          <dt>상품</dt><dd>${escapeHtml(o.product_name)} × ${o.quantity}</dd>
          <dt>결제 금액</dt><dd>${won(o.amount)}</dd>
          <dt>결제 수단</dt><dd>${escapeHtml(o.method || "-")}</dd>
          <dt>주문번호</dt><dd>${escapeHtml(o.order_id)}</dd>
        </dl>
        <a class="btn" href="orders.html">내 결제 내역 보기</a>
        <a class="btn btn-secondary" href="index.html">쇼핑 계속하기</a>`;
    }

    confirmPayment().catch((err) => showFail(err.message));
  </script>
</body>
</html>
