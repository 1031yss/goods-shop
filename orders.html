<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 결제 내역 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <main>
    <h1>내 결제 내역</h1>
    <div id="content"></div>
  </main>

  <script>
    const content = document.getElementById("content");

    async function loadOrders() {
      const user = await requireLogin();
      if (!user) return;

      const { data, error } = await sb
        .from("orders")
        .select("*")
        .eq("user_id", user.id)
        .eq("status", "paid")
        .order("approved_at", { ascending: false });

      if (error) {
        content.innerHTML = '<p class="msg msg-error">결제 내역을 불러오지 못했습니다. 새로고침해 주세요.</p>';
        return;
      }
      if (data.length === 0) {
        content.innerHTML = '<p class="empty">아직 결제한 상품이 없습니다.</p><a class="btn" href="index.html">상품 보러 가기</a>';
        return;
      }

      content.innerHTML = `
        <table class="order-table">
          <thead><tr><th>결제일</th><th>상품</th><th>금액</th><th>결제 수단</th><th>주문번호</th></tr></thead>
          <tbody>${data.map((o) => `
            <tr>
              <td data-label="결제일"><span>${formatDate(o.approved_at)}</span></td>
              <td data-label="상품"><span>${escapeHtml(o.product_name)}</span></td>
              <td data-label="금액"><span class="order-amount">${won(o.amount)}</span></td>
              <td data-label="결제 수단"><span>${escapeHtml(o.method || "-")}</span></td>
              <td data-label="주문번호"><span class="order-id">${escapeHtml(o.order_id)}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>`;
    }
    loadOrders();
  </script>
</body>
</html>
