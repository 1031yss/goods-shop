<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <main class="narrow">
    <div class="mode-switch">
      <button type="button" id="mode-login" aria-pressed="true">로그인</button>
      <button type="button" id="mode-signup" aria-pressed="false">회원가입</button>
    </div>

    <form id="form">
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="email" required />
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" minlength="6" required />
      <p id="pw-hint" class="hint" hidden>6자 이상 입력하세요.</p>
      <p id="msg" class="msg msg-error" role="alert"></p>
      <button type="submit" id="submit" class="btn">로그인</button>
    </form>
  </main>

  <script>
    let mode = "login";
    const el = (id) => document.getElementById(id);

    function setMode(next) {
      mode = next;
      const label = mode === "login" ? "로그인" : "회원가입";
      el("submit").textContent = label;
      document.title = label + " | 굿즈샵";
      el("mode-login").setAttribute("aria-pressed", mode === "login");
      el("mode-signup").setAttribute("aria-pressed", mode === "signup");
      el("pw-hint").hidden = mode === "login";
      el("password").autocomplete = mode === "login" ? "current-password" : "new-password";
      el("msg").textContent = "";
    }

    // 로그인 후 이동할 곳. 다른 사이트로 넘어가지 않도록 이 사이트의 페이지만 허용한다.
    function goNext(user) {
      if (isAdmin(user)) {
        location.href = "admin.html";
        return;
      }
      const next = new URLSearchParams(location.search).get("next") || "";
      location.href = /^[a-z]+\.html(\?[^#]*)?$/.test(next) ? next : "index.html";
    }

    function errorText(error) {
      const m = error.message || "";
      if (m.includes("Invalid login credentials")) return "이메일 또는 비밀번호가 맞지 않습니다.";
      if (m.includes("already registered")) return "이미 가입한 이메일입니다. 로그인해 주세요.";
      if (m.includes("Password should be")) return "비밀번호는 6자 이상 입력하세요.";
      if (m.includes("valid") && m.includes("email")) return "이메일 주소를 확인해 주세요.";
      return "처리하지 못했습니다: " + m;
    }

    el("mode-login").addEventListener("click", () => setMode("login"));
    el("mode-signup").addEventListener("click", () => setMode("signup"));

    el("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      el("submit").disabled = true;
      el("msg").textContent = "";

      const credentials = { email: el("email").value.trim(), password: el("password").value };
      const { data, error } = mode === "login"
        ? await sb.auth.signInWithPassword(credentials)
        : await sb.auth.signUp(credentials);

      if (error) {
        el("msg").textContent = errorText(error);
        el("submit").disabled = false;
        return;
      }
      goNext(data.user);
    });

    // 헤더의 회원가입 버튼으로 들어오면 회원가입 탭을 연다
    if (new URLSearchParams(location.search).get("mode") === "signup") setMode("signup");

    // 이미 로그인했으면 바로 이동
    getUser().then((user) => { if (user) goNext(user); });
  </script>
</body>
</html>
