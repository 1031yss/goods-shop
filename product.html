<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 결제 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <main>
    <a class="back-link" href="index.html">상품 목록으로</a>
    <div id="detail" class="product-detail" hidden>
      <img id="photo" class="product-photo" alt="" referrerpolicy="no-referrer" />
      <div>
        <h1 id="name"></h1>
        <p id="price" class="detail-price"></p>
        <div class="pay-widget">
          <div id="payment-method"></div>
          <div id="agreement"></div>
        </div>
        <p id="msg" class="msg msg-error" role="alert"></p>
        <button type="button" id="pay-btn" class="btn" disabled>결제하기</button>
      </div>
    </div>
    <p id="page-msg" class="msg msg-error" role="alert"></p>
  </main>

  <script>
    const el = (id) => document.getElementById(id);
    const productId = Number(new URLSearchParams(location.search).get("id"));
    let user, product, widgets;

    async function init() {
      // 결제하려면 로그인이 필요하다
      user = await requireLogin();
      if (!user) return;

      const { data, error } = await sb.from("products").select("*").eq("id", productId).maybeSingle();
      if (error || !data) {
        el("page-msg").textContent = "상품을 찾을 수 없습니다. 상품 목록에서 다시 선택해 주세요.";
        return;
      }
      product = data;
      document.title = product.name + " | 굿즈샵";
      el("photo").src = product.image_url;
      el("name").textContent = product.name;
      el("price").textContent = won(product.price);
      el("detail").hidden = false;

      // 토스 결제위젯 준비 (customerKey = 우리 사이트의 사용자 ID)
      widgets = TossPayments(TOSS_CLIENT_KEY).widgets({ customerKey: user.id });
      await widgets.setAmount({ currency: "KRW", value: product.price });
      await Promise.all([
        widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
        widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
      ]);
      el("pay-btn").disabled = false;
    }

    el("pay-btn").addEventListener("click", async () => {
      el("pay-btn").disabled = true;
      el("msg").textContent = "";

      // 1) 주문을 먼저 만든다. 금액은 DB 트리거가 상품 가격으로 채운다.
      const { data: order, error } = await sb
        .from("orders")
        .insert({ product_id: product.id })
        .select()
        .single();
      if (error) {
        el("msg").textContent = "주문을 만들지 못했습니다. 다시 시도해 주세요.";
        el("pay-btn").disabled = false;
        return;
      }

      // 2) DB가 정한 금액으로 토스 결제창을 연다
      try {
        await widgets.setAmount({ currency: "KRW", value: order.amount });
        await widgets.requestPayment({
          orderId: order.order_id,
          orderName: order.product_name.slice(0, 100),
          customerEmail: user.email,
          successUrl: new URL("success.html", location.href).href,
          failUrl: new URL("fail.html", location.href).href,
        });
      } catch (err) {
        // 사용자가 결제창을 닫은 경우 등
        el("msg").textContent = err.message || "결제를 진행하지 못했습니다. 다시 시도해 주세요.";
        el("pay-btn").disabled = false;
      }
    });

    init().catch((err) => {
      el("page-msg").textContent = "결제 화면을 준비하지 못했습니다: " + err.message;
    });
  </script>
</body>
</html>
