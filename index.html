<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 목록 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <main>
    <h1>상품 목록</h1>
    <ul id="list" class="product-grid"></ul>
    <p id="msg" class="msg"></p>
  </main>

  <script>
    async function loadProducts() {
      const { data, error } = await sb.from("products").select("*").order("id");
      if (error) {
        const msg = document.getElementById("msg");
        msg.className = "msg msg-error";
        msg.textContent = "상품을 불러오지 못했습니다. 새로고침해 주세요.";
        return;
      }
      document.getElementById("list").innerHTML = data.map((p) => `
        <li>
          <a class="product-link" href="product.html?id=${p.id}">
            <img class="product-photo" src="${escapeHtml(p.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" />
            <div class="product-name">${escapeHtml(p.name)}</div>
            <div class="product-price">${won(p.price)}</div>
          </a>
        </li>`).join("");
    }
    loadProducts();
  </script>
</body>
</html>
