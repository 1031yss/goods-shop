<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>상품 목록 | 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <section class="hero">
    <img id="hero-img" class="hero-img" alt="" referrerpolicy="no-referrer" hidden />
    <div class="hero-text">
      <h1>잠자리를 바꾸는<br />가장 쉬운 방법</h1>
      <p>매트리스커버와 침구 세트, 문걸이 옷걸이를 모았습니다. 마음에 드는 상품은 테스트 결제로 바로 구매해 볼 수 있습니다.</p>
      <a class="hero-btn" href="#products">상품 보러 가기</a>
    </div>
  </section>

  <main>
    <h2 id="products" class="section-title">상품 목록</h2>
    <ul id="list" class="product-grid"></ul>
    <p id="msg" class="msg"></p>
  </main>

  <script>
    async function loadProducts() {
      const { data, error } = await sb.from("products").select("*").order("id");
      if (error) {
        const msg = document.getElementById("msg");
        msg.className = "msg msg-error";
        msg.textContent = "상품을 불러오지 못했습니다. 새로고침해 주세요.";
        return;
      }
      document.getElementById("list").innerHTML = data.map((p) => `
        <li>
          <a class="product-link" href="product.html?id=${p.id}">
            <img class="product-photo" src="${escapeHtml(p.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" />
            <div class="product-name">${escapeHtml(p.name)}</div>
            <div class="product-price">${won(p.price)}</div>
          </a>
        </li>`).join("");

      // 히어로 배경은 어두운 톤의 상품 사진 (5번째 상품)
      const heroImg = document.getElementById("hero-img");
      const heroProduct = data[4] || data[0];
      if (heroProduct) {
        heroImg.src = heroProduct.image_url;
        heroImg.hidden = false;
      }
    }
    loadProducts();
  </script>
</body>
</html>
